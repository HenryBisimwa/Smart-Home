<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - SmartHome</title>

    <link rel="stylesheet" href="../src/output.css">
</head>

<body class="h-screen bg-gray-200 flex justify-center items-center p-4">

    <div class="bg-gray-700 rounded-2xl shadow-xl w-full max-w-md p-6">

        <div class="text-center mb-6 text-white">
            <h1 class="text-3xl font-bold">
                <span>Smart</span><span class="text-green-500"> Home</span>
            </h1>

            <p class="mt-2"> Connectez-vous à SmartHome</p>
        </div>

        <form id="login-form" class="space-y-4 text-white">

            <div>
                <label for="password" class=" mb-2 font-bold">  Mot de passe </label>
                <input type="password" id="password" placeholder="Entrer le mot de passe"  class="w-full px-4 py-3 rounded-lg text-white border"  required >
            </div>

            <button   type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg"> Se connecter</button>
        </form>

        <div class="text-center text-white mt-4">
            <a href="../index.html" class="hover:text-green-400 hover:underline">  ← Retour à l'accueil </a>
        </div>
    </div>



    <script>

       let form=document.getElementById("login-form")
       form.addEventListener("submit", function(e) {
            e.preventDefault();

            let password = document.getElementById("password").value;

            if (password === "12345678") {
                window.location.href = "app.html";
            } else {
                alert("Mot de passe incorrect !");
            }
        });

    </script>

</body>
</html>
